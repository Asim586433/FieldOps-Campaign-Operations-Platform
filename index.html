<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReturnVote · Campaign Operations Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f8f9fb;
            color: #111827;
            font-size: 14px;
            line-height: 1.5;
        }
        :root {
            --navy-950: #0b1220;
            --navy-900: #0f1b30;
            --navy-800: #152442;
            --navy-700: #1c2f54;
            --blue-600: #2454e0;
            --blue-500: #2f66f0;
            --blue-100: #e7edfd;
            --blue-50: #f3f6fe;
            --gray-950: #0d1117;
            --gray-900: #111827;
            --gray-800: #1f2937;
            --gray-700: #374151;
            --gray-600: #4b5563;
            --gray-500: #6b7280;
            --gray-400: #9ca3af;
            --gray-300: #d1d5db;
            --gray-200: #e5e7eb;
            --gray-100: #f3f4f6;
            --gray-50: #f8f9fb;
            --green-600: #0a8f5b;
            --green-100: #e3f7ec;
            --amber-600: #b4740e;
            --amber-100: #fdf1de;
            --red-600: #c22a3e;
            --red-100: #fbe7ea;
            --purple-600: #6d3fce;
            --purple-100: #efe8fd;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
            --shadow-md: 0 4px 12px rgba(16, 24, 40, .08);
            --shadow-lg: 0 12px 32px rgba(16, 24, 40, .14);
            --sidebar-w: 250px;
            --sidebar-w-collapsed: 68px;
            --header-h: 60px;
        }
        #app {
            display: flex;
            min-height: 100vh;
        }
        #sidebar {
            width: var(--sidebar-w);
            background: var(--navy-950);
            color: #cbd5f0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 60;
            transition: width .18s ease, transform .2s ease;
            overflow: hidden;
        }
        #sidebar.collapsed {
            width: var(--sidebar-w-collapsed);
        }
        .sb-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
            flex-shrink: 0;
            white-space: nowrap;
        }
        .sb-brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--blue-500), #5b8dff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: 14px;
            flex-shrink: 0;
        }
        .sb-brand-text {
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            overflow: hidden;
        }
        .sb-brand-text small {
            display: block;
            font-weight: 500;
            font-size: 10.5px;
            color: #8fa3d1;
            letter-spacing: .04em;
            text-transform: uppercase;
        }
        #sidebar.collapsed .sb-brand-text {
            display: none;
        }
        .sb-nav {
            flex: 1;
            overflow-y: auto;
            padding: 10px 10px;
        }
        .sb-section-label {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: #5f75a8;
            padding: 14px 10px 6px;
            font-weight: 700;
            white-space: nowrap;
        }
        #sidebar.collapsed .sb-section-label {
            display: none;
        }
        .sb-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 9px 10px;
            border-radius: 8px;
            color: #c6d2ee;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            margin-bottom: 1px;
            border: 1px solid transparent;
            position: relative;
            transition: background .15s;
        }
        .sb-item:hover {
            background: rgba(255, 255, 255, .06);
            color: #fff;
        }
        .sb-item.active {
            background: rgba(47, 102, 240, .22);
            color: #fff;
            border-color: rgba(75, 124, 240, .35);
        }
        .sb-item.active .sb-icon {
            color: #7ba1ff;
        }
        .sb-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8fa3d1;
        }
        .sb-icon svg {
            width: 17px;
            height: 17px;
            opacity: .85;
        }
        .sb-label {
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #sidebar.collapsed .sb-label {
            display: none;
        }
        #sidebar.collapsed .sb-item {
            justify-content: center;
        }
        .sb-badge {
            margin-left: auto;
            background: var(--blue-600);
            color: #fff;
            font-size: 10.5px;
            font-weight: 700;
            border-radius: 20px;
            padding: 1px 7px;
        }
        #sidebar.collapsed .sb-badge {
            display: none;
        }
        .sb-footer {
            border-top: 1px solid rgba(255, 255, 255, .08);
            padding: 12px 14px;
            flex-shrink: 0;
        }
        .sb-user {
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: background .15s;
        }
        .sb-user:hover {
            background: rgba(255, 255, 255, .06);
        }
        .sb-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            background: linear-gradient(135deg, #5b8dff, #7a5bff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 12.5px;
        }
        .sb-user-meta {
            overflow: hidden;
            white-space: nowrap;
        }
        #sidebar.collapsed .sb-user-meta {
            display: none;
        }
        .sb-user-name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }
        .sb-user-role {
            font-size: 11px;
            color: #8fa3d1;
        }
        .sb-collapse-btn {
            width: 100%;
            margin-top: 10px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .08);
            color: #a9b8de;
            border-radius: 8px;
            padding: 7px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background .15s;
        }
        .sb-collapse-btn:hover {
            background: rgba(255, 255, 255, .1);
        }
        #main-col {
            flex: 1;
            min-width: 0;
            margin-left: var(--sidebar-w);
            transition: margin-left .18s ease;
            display: flex;
            flex-direction: column;
        }
        #main-col.collapsed {
            margin-left: var(--sidebar-w-collapsed);
        }
        #header {
            height: var(--header-h);
            flex-shrink: 0;
            background: #fff;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 18px;
            position: sticky;
            top: 0;
            z-index: 40;
        }
        .hdr-burger {
            display: none;
            background: none;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            width: 34px;
            height: 34px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--gray-600);
        }
        .hdr-desktop-toggle {
            background: none;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--gray-500);
            flex-shrink: 0;
        }
        .hdr-desktop-toggle:hover {
            background: var(--gray-100);
        }
        .hdr-select {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid var(--gray-200);
            cursor: pointer;
            min-width: 150px;
        }
        .hdr-select:hover {
            background: var(--gray-50);
        }
        .hdr-select-label {
            font-size: 10px;
            color: var(--gray-500);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .03em;
        }
        .hdr-select-value {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-900);
        }
        .hdr-search {
            flex: 1;
            max-width: 420px;
            position: relative;
            display: flex;
            align-items: center;
        }
        .hdr-search input {
            width: 100%;
            padding: 8px 12px 8px 34px;
            border-radius: 8px;
            border: 1px solid var(--gray-200);
            background: var(--gray-50);
            font-size: 13.5px;
            color: var(--gray-900);
        }
        .hdr-search input:focus {
            background: #fff;
            border-color: var(--blue-500);
            outline: none;
        }
        .hdr-search svg {
            position: absolute;
            left: 10px;
            width: 16px;
            height: 16px;
            color: var(--gray-400);
        }
        .hdr-right {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
            flex-shrink: 0;
        }
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--gray-200);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--gray-600);
            position: relative;
            transition: background .15s;
        }
        .icon-btn:hover {
            background: var(--gray-50);
        }
        .icon-btn svg {
            width: 17px;
            height: 17px;
        }
        .dot-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            background: var(--red-600);
            color: #fff;
            font-size: 9.5px;
            font-weight: 700;
            border-radius: 20px;
            min-width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 3px;
            border: 2px solid #fff;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            white-space: nowrap;
            transition: background .15s, opacity .15s;
        }
        .btn svg {
            width: 15px;
            height: 15px;
        }
        .btn-primary {
            background: var(--blue-600);
            color: #fff;
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:hover {
            background: #1d47c9;
        }
        .btn-secondary {
            background: #fff;
            border-color: var(--gray-300);
            color: var(--gray-700);
        }
        .btn-secondary:hover {
            background: var(--gray-50);
        }
        .btn-success {
            background: var(--green-600);
            color: #fff;
        }
        .btn-success:hover {
            background: #0a7a4e;
        }
        .btn-danger {
            background: var(--red-600);
            color: #fff;
        }
        .btn-danger:hover {
            background: #a5202f;
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 7px;
        }
        .hdr-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #5b8dff, #7a5bff);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            flex-shrink: 0;
        }
        #content {
            padding: 22px 26px 60px;
            max-width: 1520px;
            width: 100%;
            margin: 0 auto;
        }
        .page-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -.01em;
        }
        .page-sub {
            font-size: 13px;
            color: var(--gray-500);
            margin-top: 3px;
        }
        .page-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .grid {
            display: grid;
            gap: 14px;
        }
        .grid-4 {
            grid-template-columns: repeat(4, 1fr);
        }
        .grid-3 {
            grid-template-columns: repeat(3, 1fr);
        }
        .grid-2 {
            grid-template-columns: repeat(2, 1fr);
        }
        @media(max-width:1200px) {
            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media(max-width:700px) {
            .grid-4,
            .grid-3,
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }
        .card-pad {
            padding: 18px;
        }
        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            border-bottom: 1px solid var(--gray-100);
        }
        .card-title {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--gray-900);
        }
        .kpi-card {
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .kpi-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .kpi-label {
            font-size: 12px;
            color: var(--gray-500);
            font-weight: 600;
        }
        .kpi-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .kpi-value {
            font-size: 25px;
            font-weight: 800;
            color: var(--gray-900);
            letter-spacing: -.02em;
        }
        .kpi-delta {
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .kpi-delta.up {
            color: var(--green-600);
        }
        .kpi-delta.down {
            color: var(--red-600);
        }
        .kpi-delta.flat {
            color: var(--gray-500);
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2.5px 9px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 700;
            white-space: nowrap;
        }
        .badge-gray {
            background: var(--gray-100);
            color: var(--gray-700);
        }
        .badge-blue {
            background: var(--blue-100);
            color: var(--blue-600);
        }
        .badge-green {
            background: var(--green-100);
            color: var(--green-600);
        }
        .badge-amber {
            background: var(--amber-100);
            color: var(--amber-600);
        }
        .badge-red {
            background: var(--red-100);
            color: var(--red-600);
        }
        .badge-purple {
            background: var(--purple-100);
            color: var(--purple-600);
        }
        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        thead th {
            text-align: left;
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 700;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: .04em;
            border-bottom: 1px solid var(--gray-200);
            background: var(--gray-50);
            white-space: nowrap;
        }
        tbody td {
            padding: 11px 14px;
            border-bottom: 1px solid var(--gray-100);
            color: var(--gray-800);
            vertical-align: middle;
        }
        tbody tr:hover {
            background: var(--blue-50);
        }
        .cell-primary {
            font-weight: 600;
            color: var(--gray-900);
        }
        .cell-sub {
            font-size: 11.5px;
            color: var(--gray-500);
            margin-top: 1px;
        }
        .table-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--gray-100);
            flex-wrap: wrap;
        }
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-bar select,
        .filter-bar input {
            width: auto;
            min-width: 120px;
            padding: 7px 10px;
            font-size: 12.5px;
            border-radius: 8px;
            border: 1px solid var(--gray-300);
            background: #fff;
        }
        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: var(--blue-500);
            outline: none;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 20, 35, .5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
            backdrop-filter: blur(1px);
        }
        .modal {
            background: #fff;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 560px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
        }
        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--gray-100);
            flex-shrink: 0;
        }
        .modal-title {
            font-size: 15.5px;
            font-weight: 700;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
        }
        .modal-foot {
            padding: 14px 20px;
            border-top: 1px solid var(--gray-100);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }
        .modal-close {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            border: none;
            background: var(--gray-100);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray-600);
        }
        .modal-close:hover {
            background: var(--gray-200);
        }
        .progress {
            height: 7px;
            border-radius: 20px;
            background: var(--gray-200);
            overflow: hidden;
        }
        .progress>div {
            height: 100%;
            background: var(--blue-600);
            border-radius: 20px;
        }
        .mobile-overlay {
            display: none;
        }
        @media(max-width:1024px) {
            #sidebar {
                transform: translateX(-100%);
                width: 260px;
            }
            #sidebar.mobile-open {
                transform: translateX(0);
            }
            #main-col {
                margin-left: 0 !important;
            }
            .hdr-burger {
                display: flex;
            }
            .hdr-desktop-toggle {
                display: none;
            }
            .mobile-overlay.show {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, .4);
                z-index: 55;
            }
            #content {
                padding: 16px;
            }
        }
        .muted {
            color: var(--gray-500);
        }
        .small {
            font-size: 12px;
        }
        .flex {
            display: flex;
        }
        .gap-6 {
            gap: 6px;
        }
        .gap-8 {
            gap: 8px;
        }
        .gap-10 {
            gap: 10px;
        }
        .flex-between {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .street-progress {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--gray-100);
        }
        .street-progress .street-name {
            min-width: 150px;
            font-weight: 600;
        }
        .street-progress .progress {
            flex: 1;
        }
        .household-card {
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .qa-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .qa-btn {
            padding: 12px 8px;
            border-radius: 10px;
            border: 1.5px solid var(--gray-200);
            background: #fff;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--gray-800);
            text-align: center;
            transition: border-color .15s, background .15s;
        }
        .qa-btn:hover {
            border-color: var(--blue-500);
            background: var(--blue-50);
        }
        .qa-btn svg {
            width: 18px;
            height: 18px;
            color: var(--blue-600);
        }
        .qa-btn.success:hover {
            border-color: var(--green-600);
            background: var(--green-100);
        }
        .qa-btn.success svg {
            color: var(--green-600);
        }
        .qa-btn.danger:hover {
            border-color: var(--red-600);
            background: var(--red-100);
        }
        .qa-btn.danger svg {

        ];

                name: 'Ward 4' }, { id: 'W5', name: 'Ward 5' }];

            W3: ['Precinct 3', 'Precinct 4'], W4: ['Precinct 1', 'Precinct 5'], W5: ['Precinct 2', 'Precinct 6'] };
        const BALLOT_STATUSES = ['Ballot Requested', 'Application Received', 'Ballot Mailed', 'Outstanding',
            'Voter Contacted', 'Voter Says Returned', 'Officially Returned', 'Ballot Issue', 'Rejected', 'Curing Needed',
            'Completed'
        ];
        const CANVASS_STATUSES = ['Not Visited', 'Completed', 'No Answer', 'Follow-Up', 'Registration Needed',
            'Ballot Follow-Up', 'Spoke With Voter', 'Literature Dropped', 'Moved', 'Vacant', 'Refused', 'Wrong Address'
        ];
        const CONTACT_RESULTS = ['Called - Answered', 'Called - No Answer', 'Text Sent', 'Wrong Number', 'Disconnected',
            'Voter Says Ballot Returned', 'Voter Needs Assistance', 'Voter Will Return Ballot', 'Do Not Contact'
        ];

        function makeVoter(i) {
            const first = FIRST[i % FIRST.length],
                last = LAST[(i * 3 + 1) % LAST.length];
            const ward = randOf(WARDS);
            const precinct = randOf(PRECINCTS[ward.id]);
            const street = randOf(STREETS);
            const houseNum = randInt(100, 3800);
            const worker = randOf(WORKERS.filter(w => w.role === 'Canvasser'));
            const regStatus = i % 9 === 0 ? randOf(['Registration Needed', 'Registration Follow-Up', 'Registration Pending']) :
                'Registered';
            const mailedDaysAgo = randInt(1, 26);
            let ballotStatus;
            const r = Math.random();
            if (r < 0.03) ballotStatus = 'Ballot Requested';
            else if (r < 0.06) ballotStatus = 'Application Received';
            else if (mailedDaysAgo < 3) ballotStatus = 'Ballot Mailed';
            else if (r < 0.45) ballotStatus = 'Outstanding';
            else if (r < 0.55) ballotStatus = 'Voter Contacted';
            else if (r < 0.63) ballotStatus = 'Voter Says Returned';
            else if (r < 0.90) ballotStatus = 'Officially Returned';
            else if (r < 0.94) ballotStatus = 'Ballot Issue';
            else if (r < 0.97) ballotStatus = 'Curing Needed';
            else ballotStatus = 'Completed';
            const canvassStatus = randOf(CANVASS_STATUSES);
            return {
                id: i,
                voterId: 'MI-' + (100000 + i * 7 + ward.id.charCodeAt(1)),
                first,
                last,
                name: first + ' ' + last,
                address: `${houseNum} ${street}`,
                city: 'Flint, MI 4850' + (ward.id[1]),
                ward: ward.name,
                wardId: ward.id,
                precinct,
                street,
                phone: `810-555-${String(1000 + i * 7).slice(-4)}`,
                email: `${first.toLowerCase()}.${last.toLowerCase()}@example.com`,
                registration: regStatus,
                ballotStatus,
                ballotMailedDate: (ballotStatus === 'Ballot Requested' || ballotStatus === 'Application Received') ? null :

                ballotReturnedDate: (ballotStatus === 'Officially Returned' || ballotStatus === 'Completed') ? daysAgo(

                voterSaysReturnedDate: ballotStatus === 'Voter Says Returned' ? daysAgo(randInt(0, mailedDaysAgo - 1)) :

        window.filterVoters = function() {
            const ward = document.getElementById('filterWard')?.value || '';
            const status = document.getElementById('filterStatus')?.value || '';
            const canvass = document.getElementById('filterCanvass')?.value || '';
            const reg = document.getElementById('filterReg')?.value || '';
            const search = document.getElementById('voterSearch')?.value?.toLowerCase() || '';
            let filtered = VOTERS;
            if (ward) filtered = filtered.filter(v => v.ward === ward);
            if (status) filtered = filtered.filter(v => v.ballotStatus === status);
            if (canvass) filtered = filtered.filter(v => v.canvassStatus === canvass);
            if (reg) filtered = filtered.filter(v => v.registration === reg);
            if (search) filtered = filtered.filter(v => v.name.toLowerCase().includes(search) || v.address.toLowerCase()
                .includes(search) || v.phone.includes(search) || v.voterId.toLowerCase().includes(search));
            const tbody = document.getElementById('voterTableBody');
            if (!tbody) return;
            tbody.innerHTML = filtered.slice(0, 25).map(v => `
                        <tr class="clickable-row" onclick="showVoterDetail(${v.id})">
                            <td><div class="cell-primary">${esc(v.name)}</div><div class="cell-sub">${esc(v.address)}</div></td>
                            <td>${v.ward}</td>
                            <td><span class="badge badge-${v.ballotStatus==='Officially Returned'||v.ballotStatus==='Completed'?'green':v.ballotStatus==='Outstanding'||v.ballotStatus==='Ballot Mailed'?'amber':v.ballotStatus==='Voter Says Returned'?'purple':'gray'}">${v.ballotStatus}</span></td>
                            <td><span class="badge badge-${v.registration==='Registered'?'green':v.registration.includes('Assisted')?'amber':'red'}">${v.registration}</span></td>
                            <td>${v.assignedWorker}</td>
                            <td><span class="badge badge-${v.canvassStatus==='Completed'||v.canvassStatus==='Spoke With Voter'?'green':v.canvassStatus==='Not Visited'?'gray':'amber'}">${v.canvassStatus}</span></td>
                            <td>${v.dnc?'🚫':''}</td>
                        </tr>
                    `).join('');
            if (filtered.length === 0) tbody.innerHTML =
                '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--gray-500)">No voters match your filters</td></tr>';
        };

        window.showVoterDetail = function(id) {
            const v = VOTERS.find(v => v.id === id);

            const contactHtml = contacts.slice(0, 8).map(c => `

                            <span><span class="badge badge-${c.type==='Call'?'blue':c.type==='Door'?'amber':'green'}">${c.type}</span> ${c.result}</span>
                            <span class="muted small">${fmtDate(c.date)} · ${c.worker}</span>
                        </div>

            const regFollow = v.registrationFollowUp ? `📋 Registration Follow-Up: ${v.registrationFollowUp}\n` : '';
            toast(`📋 ${v.name}\n📍 ${v.address}\n📞 ${v.phone}\n🗳️ ${v.ballotStatus}\n📬 Voter Says Returned: ${v.voterSaysReturnedDate?fmtDate(v.voterSaysReturnedDate):'No'}\n📬 Officially Returned: ${v.ballotReturnedDate?fmtDate(v.ballotReturnedDate):'No'}\n👤 ${v.assignedWorker}\n${regAssist}${regFollow}${v.dnc?'🚫 Do Not Contact\n':''}${v.notes? '📝 '+v.notes:''}\n${contacts.length>0?'\n📞 Recent Contacts:\n'+contactHtml:''}`);
        };

        // ===== BALLOT =====

            return `
                        <div class="page-head"><div><div class="page-title">Ballot Tracker</div><div class="page-sub">${fmt(returned)} official returns · ${fmt(vsReturned)} voter-says-returned · ${fmt(outstanding)} outstanding</div></div><div class="page-actions">${isAdmin?`<button class="btn btn-success btn-sm" onclick="runReconciliation()">${ic('upload')} Reconcile Returns</button>`:''}</div></div>

                            ${tenDayOut.slice(0,10).map(v=>`
                                <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--gray-100)">
                                    <span>${esc(v.name)} — ${v.ward}</span>

                                </div>

                        </div></div>
                    `;

        // ===== RECONCILIATION =====
        window.runReconciliation = function() {
            if (!currentUser || currentUser.role !== 'Campaign Admin') {
                toast('Admin access required', 'error');
                return;
            }
            const processed = 892;
            let matched = 0;
            let alreadyReturned = 0;
            let errors = 0;
            VOTERS.forEach(v => {
                if (v.ballotStatus === 'Outstanding' || v.ballotStatus === 'Ballot Mailed' || v.ballotStatus ===
                    'Voter Says Returned') {
                    if (Math.random() > 0.15) {
                        const oldStatus = v.ballotStatus;
                        v.ballotStatus = 'Officially Returned';
                        v.ballotReturnedDate = new Date();
                        matched++;
                        AUDIT_LOG.unshift({ id: uid('A'), date: new Date(), time: fmtTime(new Date()),
                            user: currentUser.name, action: 'Ballot Returned',
                            detail: `${v.name}: ${oldStatus} → Officially Returned` });
                    } else {
                        errors++;
                    }
                } else if (v.ballotStatus === 'Officially Returned' || v.ballotStatus === 'Completed') {
                    alreadyReturned++;
                }
            });
            const msg =
                `📊 Reconciliation Complete\n${processed} records processed\n${matched} voters matched → changed to Returned\n${alreadyReturned} already marked Returned\n${errors} records could not be matched`;
            toast(msg, 'success');
            renderPage();
        };

                                        <button class="btn btn-sm btn-secondary" onclick="recordContact(${v.id},'Call')">${ic('phone')}</button>
                                        <button class="btn btn-sm btn-secondary" onclick="recordContact(${v.id},'SMS')">${ic('sms')}</button>
                                        <button class="btn btn-sm btn-success" onclick="markReturned(${v.id})">${ic('check')}</button>
                                    </div></td>
                                </tr>`;
                            }).join('')}
                            ${chaseVoters.length>20?`<tr><td colspan="6" style="text-align:center;padding:12px;color:var(--gray-500)">+${chaseVoters.length-20} more outstanding ballots</td></tr>`:''}
                        </tbody></table></div></div>
                    `;
        }

        window.recordContact = function(id, type) {
            const v = VOTERS.find(v => v.id === id);
            if (!v) return;
            const result = prompt(
                `Record ${type} contact for ${v.name}:\nChoose result: Called-Answered, Called-No Answer, Text Sent, Wrong Number, Disconnected, Voter Says Ballot Returned, Voter Needs Assistance, Voter Will Return Ballot, Do Not Contact`
                );
            if (!result) return;
            const workerName = currentUser ? currentUser.name : 'Unknown';
            v.contacts.push({ type: type, result: result, date: new Date(), worker: workerName, note: '' });
            if (result === 'Voter Says Ballot Returned') {
                v.ballotStatus = 'Voter Says Returned';
                v.voterSaysReturnedDate = new Date();
            }
            if (result === 'Do Not Contact') {
                v.dnc = true;
            }
            toast(`✅ ${type} contact recorded for ${v.name}: ${result}`, 'success');
            AUDIT_LOG.unshift({ id: uid('A'), date: new Date(), time: fmtTime(new Date()), user: workerName,
                action: 'Contact Recorded', detail: `${v.name}: ${type} → ${result}` });
            renderPage();
        };

        window.markReturned = function(id) {
            const v = VOTERS.find(v => v.id === id);
            if (!v) return;
            const oldStatus = v.ballotStatus;
            v.ballotStatus = 'Officially Returned';
            v.ballotReturnedDate = new Date();
            const workerName = currentUser ? currentUser.name : 'Unknown';
            toast(`✅ ${v.name} marked as Officially Returned`, 'success');
            AUDIT_LOG.unshift({ id: uid('A'), date: new Date(), time: fmtTime(new Date()), user: workerName,
                action: 'Ballot Returned',
                detail: `${v.name}: ${oldStatus} → Officially Returned (Entered by: ${workerName})` });
            renderPage();
        };

        // ===== FIELD OPS =====
        function renderFieldOps() {
            const total = VOTERS.length;
            const doorsAttempted = VOTERS.filter(v => v.canvassStatus !== 'Not Visited').length;
            const contacted = VOTERS.filter(v => v.canvassStatus === 'Spoke With Voter' || v.canvassStatus === 'Completed')
                .length;
            const litDrops = VOTERS.filter(v => v.canvassStatus === 'Literature Dropped').length;
            const regAssisted = VOTERS.filter(v => v.registrationAssisted !== null).length;
            const territoryCompleted = Math.round(doorsAttempted / total * 100);

            return `
                        <div class="page-head"><div><div class="page-title">Field Operations</div><div class="page-sub">Canvassing data bank · Street-level tracking</div></div></div>
                        <div class="grid grid-3">
                            <div class="card kpi-card"><div class="kpi-top"><span class="kpi-label">Voters in Database</span></div><div class="kpi-value" style="font-size:20px">${fmt(total)}</div></div>
                            <div class="card kpi-card"><div class="kpi-top"><span class="kpi-label">Doors Attempted</span></div><div class="kpi-value" style="font-size:20px">${fmt(doorsAttempted)}</div></div>
                            <div class="card kpi-card"><div class="kpi-top"><span class="kpi-label">Territory Completed</span></div><div class="kpi-value" style="font-size:20px">${territoryCompleted}%</div></div>
                            <div class="card kpi-card"><div class="kpi-top"><span class="kpi-label">Voters Contacted</span></div><div class="kpi-value" style="font-size:20px">${fmt(contacted)}</div></div>
                            <div class="card kpi-card"><div class="kpi-top"><span class="kpi-label">Literature Drops</span></div><div class="kpi-value" style="font-size:20px">${fmt(litDrops)}</div></div>
                            <div class="card kpi-card"><div class="kpi-top"><span class="kpi-label">Registrations Assisted</span></div><div class="kpi-value" style="font-size:20px">${fmt(regAssisted)}</div></div>
                        </div>
                        <div class="card" style="margin-top:14px"><div class="card-head"><span class="card-title">Street-Level Tracking</span><span class="badge badge-blue">${STREETS.length} streets</span></div><div class="card-pad">
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                                ${STREETS.map(s=>{
                                    const voters = VOTERS.filter(v=>v.street===s);
                                    const totalS = voters.length;
                                    const completed = voters.filter(v=>v.canvassStatus!=='Not Visited').length;
                                    const spoke = voters.filter(v=>v.canvassStatus==='Spoke With Voter'||v.canvassStatus==='Completed').length;
                                    const pending = totalS - completed;
                                    return `<div class="household-card">
                                        <div style="display:flex;justify-content:space-between"><strong>${s}</strong><span class="badge badge-${completed===totalS?'green':completed>0?'amber':'gray'}">${completed}/${totalS}</span></div>
                                        <div class="small muted">${spoke} spoke · ${pending} pending</div>
                                        <div class="progress" style="margin-top:4px"><div style="width:${totalS?Math.round(completed/totalS*100):0}%"></div></div>
                                    </div>`;
                                }).join('')}
                            </div>
                        </div></div>
                        <div class="card" style="margin-top:14px"><div class="card-head"><span class="card-title">Canvasser Productivity</span></div><div class="table-wrap"><table><thead><tr><th>Worker</th><th>Assigned</th><th>Attempted</th><th>Spoke</th><th>Lit Drops</th><th>No Answer</th><th>Reg Assist</th></tr></thead><tbody>
                            ${WORKERS.filter(w=>w.role==='Canvasser').slice(0,8).map(w=>{
                                const voters = VOTERS.filter(v=>v.assignedWorker===w.name);
                                const assigned = voters.length;
                                const attempted = voters.filter(v=>v.canvassStatus!=='Not Visited').length;
                                const spoke = voters.filter(v=>v.canvassStatus==='Spoke With Voter'||v.canvassStatus==='Completed').length;
                                const lit = voters.filter(v=>v.canvassStatus==='Literature Dropped').length;
                                const noAns = voters.filter(v=>v.canvassStatus==='No Answer').length;
                                const reg = voters.filter(v=>v.registrationAssisted!==null).length;
                                return `<tr><td><strong>${w.name}</strong></td><td>${assigned}</td><td>${attempted}</td><td>${spoke}</td><td>${lit}</td><td>${noAns}</td><td>${reg}</td></tr>`;
                            }).join('')}
                        </tbody></table></div></div>
                    `;
        }

        // ===== SETTINGS =====
        function renderSettings() {
            return `<div class="page-head"><div><div class="page-title">Settings</div><div class="page-sub">Campaign configuration and automation rules</div></div></div>
                        <div class="grid grid-2">
                            <div class="card card-pad"><div class="card-title">Automation Rules</div>
                                <div style="margin-top:12px">
                                    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-100)"><span>Ballot Chase Queue (10+ days)</span><span class="badge badge-green">Enabled</span></div>
                                    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-100)"><span>Registration Follow-Up</span><span class="badge badge-green">Enabled</span></div>
                                    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-100)"><span>Voter-Says-Returned Reconciliation</span><span class="badge badge-green">Enabled</span></div>
                                    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-100)"><span>Stale Contact Re-Queue (21+ days)</span><span class="badge badge-amber">Disabled</span></div>
                                    <div style="display:flex;justify-content:space-between;padding:8px 0"><span>DNC Suppression</span><span class="badge badge-green">Enabled</span></div>
                                </div>
                            </div>
                            <div class="card card-pad"><div class="card-title">Security & Access</div>
                                <div style="margin-top:12px">
                                    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-100)"><span>MFA Required</span><span class="badge badge-green">Enabled</span></div>
                                    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-100)"><span>Session Timeout</span><span>30 minutes</span></div>
                                    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-100)"><span>Audit Logging</span><span class="badge badge-green">Active</span></div>
                                    <div style="display:flex;justify-content:space-between;padding:8px 0"><span>Data Encryption</span><span class="badge badge-green">AES-256</span></div>
                                </div>
                            </div>
                        </div>
                        <div class="card card-pad" style="margin-top:14px"><div class="card-title">Quick Actions</div>
                            <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
                                <button class="btn btn-secondary" onclick="toast('Export all data')">${ic('download')} Export Database</button>
                                <button class="btn btn-secondary" onclick="toast('Backup initiated')">${ic('clock')} Backup Now</button>
                                <button class="btn btn-danger" onclick="if(confirm('Reset all demo data?')){location.reload()}">${ic('trash')} Reset Demo Data</button>
                            </div>
                        </div>`;
        }

        // ============================================================
        // GLOBAL EXPOSE for inline onclick handlers
        // ============================================================
        window.handleLogin = handleLogin;
        window.logout = logout;
        window.globalSearch = globalSearch;
        window.showNotifications = showNotifications;
        window.showQuickAddVoter = showQuickAddVoter;
        window.filterVoters = filterVoters;
        window.showVoterDetail = showVoterDetail;
        window.runReconciliation = runReconciliation;
        window.recordContact = recordContact;
        window.markReturned = markReturned;
        window.renderPage = renderPage;
        window.toast = toast;
        window.fmtDate = fmtDate;
        window.fmtTime = fmtTime;
        window.esc = esc;
        window.ic = ic;

        // ============================================================
        // INIT - App starts with login visible
        // ============================================================
        console.log('ReturnVote platform ready - Login to begin');

        // Auto-login with demo credentials for quick testing (optional)
        // Uncomment below to auto-login as admin
        // setTimeout(() => {
        //     document.getElementById('loginEmail').value = 'admin@returnvote.com';
        //     document.getElementById('loginPassword').value = 'Admin123!';
        //     handleLogin();
        // }, 300);
    </script>
</body>
</html>
