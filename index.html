<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FieldOps · Campaign Operations Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f8f9fb;color:#111827;font-size:14px;line-height:1.5}
    :root{--navy-950:#0b1220;--navy-900:#0f1b30;--navy-800:#152442;--navy-700:#1c2f54;--blue-600:#2454e0;--blue-500:#2f66f0;--blue-100:#e7edfd;--blue-50:#f3f6fe;--gray-950:#0d1117;--gray-900:#111827;--gray-800:#1f2937;--gray-700:#374151;--gray-600:#4b5563;--gray-500:#6b7280;--gray-400:#9ca3af;--gray-300:#d1d5db;--gray-200:#e5e7eb;--gray-100:#f3f4f6;--gray-50:#f8f9fb;--green-600:#0a8f5b;--green-100:#e3f7ec;--amber-600:#b4740e;--amber-100:#fdf1de;--red-600:#c22a3e;--red-100:#fbe7ea;--purple-600:#6d3fce;--purple-100:#efe8fd;--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--shadow-sm:0 1px 2px rgba(16,24,40,.06);--shadow-md:0 4px 12px rgba(16,24,40,.08);--shadow-lg:0 12px 32px rgba(16,24,40,.14);--sidebar-w:250px;--sidebar-w-collapsed:68px;--header-h:60px}
    #app{display:flex;min-height:100vh}
    #sidebar{width:var(--sidebar-w);background:var(--navy-950);color:#cbd5f0;display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:60;transition:width .18s ease, transform .2s ease;overflow:hidden}
    #sidebar.collapsed{width:var(--sidebar-w-collapsed)}
    .sb-brand{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;white-space:nowrap}
    .sb-brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue-500),#5b8dff);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;flex-shrink:0}
    .sb-brand-text{font-weight:700;font-size:15px;color:#fff;overflow:hidden}
    .sb-brand-text small{display:block;font-weight:500;font-size:10.5px;color:#8fa3d1;letter-spacing:.04em;text-transform:uppercase}
    #sidebar.collapsed .sb-brand-text{display:none}
    .sb-nav{flex:1;overflow-y:auto;padding:10px 10px}
    .sb-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#5f75a8;padding:14px 10px 6px;font-weight:700;white-space:nowrap}
    #sidebar.collapsed .sb-section-label{display:none}
    .sb-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:#c6d2ee;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;margin-bottom:1px;border:1px solid transparent;position:relative}
    .sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
    .sb-item.active{background:rgba(47,102,240,.22);color:#fff;border-color:rgba(75,124,240,.35)}
    .sb-item.active .sb-icon{color:#7ba1ff}
    .sb-icon{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#8fa3d1}
    .sb-icon svg{width:17px;height:17px;opacity:.85}
    .sb-label{overflow:hidden;text-overflow:ellipsis}
    #sidebar.collapsed .sb-label{display:none}
    #sidebar.collapsed .sb-item{justify-content:center}
    .sb-badge{margin-left:auto;background:var(--blue-600);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px}
    #sidebar.collapsed .sb-badge{display:none}
    .sb-footer{border-top:1px solid rgba(255,255,255,.08);padding:12px 14px;flex-shrink:0}
    .sb-user{display:flex;align-items:center;gap:9px;cursor:pointer;padding:6px;border-radius:8px}
    .sb-user:hover{background:rgba(255,255,255,.06)}
    .sb-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#5b8dff,#7a5bff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12.5px}
    .sb-user-meta{overflow:hidden;white-space:nowrap}
    #sidebar.collapsed .sb-user-meta{display:none}
    .sb-user-name{font-size:13px;font-weight:600;color:#fff}
    .sb-user-role{font-size:11px;color:#8fa3d1}
    .sb-collapse-btn{width:100%;margin-top:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#a9b8de;border-radius:8px;padding:7px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px}
    .sb-collapse-btn:hover{background:rgba(255,255,255,.1)}
    #main-col{flex:1;min-width:0;margin-left:var(--sidebar-w);transition:margin-left .18s ease;display:flex;flex-direction:column}
    #main-col.collapsed{margin-left:var(--sidebar-w-collapsed)}
    #header{height:var(--header-h);flex-shrink:0;background:#fff;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;z-index:40}
    .hdr-burger{display:none;background:none;border:1px solid var(--gray-200);border-radius:8px;width:34px;height:34px;align-items:center;justify-content:center;cursor:pointer;color:var(--gray-600)}
    .hdr-desktop-toggle{background:none;border:1px solid var(--gray-200);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gray-500);flex-shrink:0}
    .hdr-desktop-toggle:hover{background:var(--gray-100)}
    .hdr-select{display:flex;flex-direction:column;gap:0;padding:4px 10px;border-radius:8px;border:1px solid var(--gray-200);cursor:pointer;min-width:150px}
    .hdr-select:hover{background:var(--gray-50)}
    .hdr-select-label{font-size:10px;color:var(--gray-500);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
    .hdr-select-value{font-size:13px;font-weight:600;color:var(--gray-900)}
    .hdr-search{flex:1;max-width:420px;position:relative;display:flex;align-items:center}
    .hdr-search input{width:100%;padding:8px 12px 8px 34px;border-radius:8px;border:1px solid var(--gray-200);background:var(--gray-50);font-size:13.5px;color:var(--gray-900)}
    .hdr-search input:focus{background:#fff;border-color:var(--blue-500)}
    .hdr-search svg{position:absolute;left:10px;width:16px;height:16px;color:var(--gray-400)}
    .hdr-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
    .icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--gray-200);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gray-600);position:relative}
    .icon-btn:hover{background:var(--gray-50)}
    .icon-btn svg{width:17px;height:17px}
    .dot-badge{position:absolute;top:-3px;right:-3px;background:var(--red-600);color:#fff;font-size:9.5px;font-weight:700;border-radius:20px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid #fff}
    .btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap}
    .btn svg{width:15px;height:15px}
    .btn-primary{background:var(--blue-600);color:#fff;box-shadow:var(--shadow-sm)}
    .btn-primary:hover{background:#1d47c9}
    .btn-secondary{background:#fff;border-color:var(--gray-300);color:var(--gray-700)}
    .btn-secondary:hover{background:var(--gray-50)}
    .btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
    .hdr-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#5b8dff,#7a5bff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;cursor:pointer;flex-shrink:0}
    #content{padding:22px 26px 60px;max-width:1520px;width:100%;margin:0 auto}
    .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
    .page-title{font-size:22px;font-weight:700;color:var(--gray-900);letter-spacing:-.01em}
    .page-sub{font-size:13px;color:var(--gray-500);margin-top:3px}
    .page-actions{display:flex;gap:8px;flex-wrap:wrap}
    .grid{display:grid;gap:14px}
    .grid-4{grid-template-columns:repeat(4,1fr)}
    .grid-3{grid-template-columns:repeat(3,1fr)}
    .grid-2{grid-template-columns:repeat(2,1fr)}
    @media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:700px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}
    .card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
    .card-pad{padding:18px}
    .card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--gray-100)}
    .card-title{font-size:14.5px;font-weight:700;color:var(--gray-900)}
    .kpi-card{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
    .kpi-top{display:flex;align-items:center;justify-content:space-between}
    .kpi-label{font-size:12px;color:var(--gray-500);font-weight:600}
    .kpi-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
    .kpi-value{font-size:25px;font-weight:800;color:var(--gray-900);letter-spacing:-.02em}
    .kpi-delta{font-size:12px;font-weight:600;display:flex;align-items:center;gap:3px}
    .kpi-delta.up{color:var(--green-600)}
    .kpi-delta.down{color:var(--red-600)}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
    .badge-gray{background:var(--gray-100);color:var(--gray-700)}
    .badge-blue{background:var(--blue-100);color:var(--blue-600)}
    .badge-green{background:var(--green-100);color:var(--green-600)}
    .badge-amber{background:var(--amber-100);color:var(--amber-600)}
    .badge-red{background:var(--red-100);color:var(--red-600)}
    .badge-purple{background:var(--purple-100);color:var(--purple-600)}
    .badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13px}
    thead th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--gray-200);background:var(--gray-50);white-space:nowrap}
    tbody td{padding:11px 14px;border-bottom:1px solid var(--gray-100);color:var(--gray-800);vertical-align:middle}
    tbody tr:hover{background:var(--blue-50)}
    .cell-primary{font-weight:600;color:var(--gray-900)}
    .cell-sub{font-size:11.5px;color:var(--gray-500);margin-top:1px}
    .table-toolbar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--gray-100);flex-wrap:wrap}
    .table-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--gray-100);flex-wrap:wrap;gap:10px}
    .filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .filter-bar select,.filter-bar input{width:auto;min-width:120px;padding:7px 10px;font-size:12.5px}
    .modal-overlay{position:fixed;inset:0;background:rgba(15,20,35,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(1px)}
    .modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--gray-100);flex-shrink:0}
    .modal-title{font-size:15.5px;font-weight:700}
    .modal-body{padding:20px;overflow-y:auto}
    .modal-foot{padding:14px 20px;border-top:1px solid var(--gray-100);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
    .modal-close{width:30px;height:30px;border-radius:7px;border:none;background:var(--gray-100);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray-600)}
    .modal-close:hover{background:var(--gray-200)}
    .progress{height:7px;border-radius:20px;background:var(--gray-200);overflow:hidden}
    .progress > div{height:100%;background:var(--blue-600);border-radius:20px}
    .mobile-overlay{display:none}
    @media(max-width:1024px){#sidebar{transform:translateX(-100%);width:260px}#sidebar.mobile-open{transform:translateX(0)}#main-col{margin-left:0 !important}.hdr-burger{display:flex}.hdr-desktop-toggle{display:none}.mobile-overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}#content{padding:16px}}
    .muted{color:var(--gray-500)}.small{font-size:12px}.flex{display:flex}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.flex-between{display:flex;align-items:center;justify-content:space-between}
  </style>
</head>
<body>
<div id="app">
  <div class="mobile-overlay" id="mobileOverlay" onclick="closeMobileSidebar()"></div>
  <aside id="sidebar"></aside>
  <div id="main-col">
    <header id="header"></header>
    <main id="content"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-stack" style="position:fixed;bottom:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:8px"></div>
<script>
  // --- ICONS ---
  const ICONS = {
    dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
    voters:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.5 2.7-6 5.5-6s5.5 2.5 5.5 6"/><circle cx="17" cy="7.5" r="2.4"/><path d="M15.2 12.6c2.3.3 4.3 2.2 4.8 5"/></svg>',
    ballot:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="1.8"/><path d="M8 8h8M8 12h8M8 16h4"/><path d="M17 16.5l1.3 1.3L21 15"/></svg>',
    field:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-5.6 7-11.4A7 7 0 0 0 5 9.6C5 15.4 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>',
    map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4L3 6.5v13L9 17l6 3 6-2.5v-13L15 7 9 4z"/><path d="M9 4v13M15 7v13"/></svg>',
    turf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l4-8h10l4 8-4 8H7l-4-8z"/><circle cx="12" cy="12" r="2.3"/></svg>',
    assign:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg>',
    registration:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-5z"/><path d="M14 3v5h6M9 13h6M9 17h4"/></svg>',
    comms:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-8.7 8.4 8.7 8.7 0 0 1-4-.9L3 20l1.1-4.9A8.4 8.4 0 1 1 21 11.5z"/></svg>',
    tasks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 12l2.5 2.5L16 9"/></svg>',
    reports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    imports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>',
    team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M2.5 20c0-3.3 2.5-5.8 5.5-5.8S13.5 16.7 13.5 20"/><path d="M14.8 14.6c2.2.3 4 2.4 4.4 5.4"/></svg>',
    settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.9 7.9 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.9 7.9 0 0 0-2.6-1.5L14 2h-4l-.5 2.5a7.9 7.9 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.9 7.9 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9c.8.65 1.66 1.15 2.6 1.5L10 22h4l.5-2.5a7.9 7.9 0 0 0 2.6-1.5l2.3.9 2-3.4-2-1.5z"/></svg>',
    search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
    bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',
    menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
    chevLeft:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>',
    chevRight:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>',
    close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5L20 7"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    dot:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>',
    phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.99.36 1.96.7 2.9a2 2 0 0 1-.45 2.11L8.1 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.11-.45c.94.34 1.91.57 2.9.7A2 2 0 0 1 22 16.9z"/></svg>',
    sms:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-8.7 8.4 8.7 8.7 0 0 1-4-.9L3 20l1.1-4.9A8.4 8.4 0 1 1 21 11.5z"/></svg>',
    door:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 21V5a2 2 0 0 1 2-2h6l4 4v14"/><path d="M6 21h12M14 12v.01"/></svg>',
    note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v13l-4 4H4z"/><path d="M8 9h8M8 13h5"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
    user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-3.6 3-6.4 7.5-6.4s7.5 2.8 7.5 6.4"/></svg>'
  };
  function ic(name){return `<span class="sb-icon">${ICONS[name]||''}</span>`}

  // --- UTILITIES ---
  function fmt(n){return Number(n).toLocaleString()}

    let ballotStatus; const r=Math.random();

  function renderTasks(){
    return `<div class="page-head"><div><div class="page-title">Tasks</div><div class="page-sub">${TASKS.filter(t=>t.status!=='Completed').length} open</div></div></div>
      <div class="card"><div class="table-wrap"><table><thead><tr><th>Task</th><th>Voter</th><th>Assigned</th><th>Due</th><th>Status</th></tr></thead><tbody>
        ${TASKS.map(t=>`<tr><td>${esc(t.title)}</td><td>${t.voter}</td><td>${t.assigned}</td><td>${fmtDate(t.due)}</td><td><span class="badge badge-${t.status==='Overdue'?'red':t.status==='In Progress'?'amber':t.status==='Completed'?'green':'gray'}">${t.status}</span></td></tr>`).join('')}
      </tbody></table></div></div>`;
  }

  // ----- IMPORTS -----
  function renderImports(){
    return `<div class="page-head"><div><div class="page-title">Imports</div></div></div>
      <div class="card"><div class="table-wrap"><table><thead><tr><th>File</th><th>Type</th><th>Records</th><th>Status</th><th>Date</th></tr></thead><tbody>
        ${IMPORTS.map(i=>`<tr><td>${i.filename}</td><td>${i.type}</td><td>${i.records}</td><td><span class="badge badge-green">${i.status}</span></td><td>${fmtDate(i.date)}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }

  // ----- SETTINGS -----
  function renderSettings(){
    return `<div class="page-head"><div><div class="page-title">Settings</div></div></div>
      <div class="card card-pad"><div class="muted">Campaign settings, automation rules, and user preferences.</div>
        <div style="margin-top:14px"><button class="btn btn-secondary" onclick="toast('Settings saved')">Save Preferences</button></div>
      </div>`;
  }

  // --- INIT ---
  renderSidebar();
  renderHeader();
  renderPage();
  console.log('FieldOps ready');
</script>
</body>
</html>
